<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- Preserve the pre-CJK test image's generic Latin/emoji fallback. CJK is
       available for missing glyphs, not a silent restyling of every baseline. -->
  <alias binding="strong"><family>sans-serif</family><prefer><family>Liberation Mono</family><family>Noto Color Emoji</family></prefer></alias>
  <alias binding="strong"><family>system-ui</family><prefer><family>Liberation Mono</family><family>Noto Color Emoji</family></prefer></alias>
  <alias binding="strong"><family>serif</family><prefer><family>Liberation Mono</family><family>Noto Color Emoji</family></prefer></alias>
  <alias binding="strong"><family>monospace</family><prefer><family>Liberation Mono</family><family>Noto Color Emoji</family></prefer></alias>
</fontconfig>
