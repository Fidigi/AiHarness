name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Run TypeScript checks (Docker)
        run: make typecheck

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Run Vitest suite (Docker)
        run: make test

  test-e2e:
    name: E2E tests (partition ${{ matrix.partition }}/4)
    runs-on: ubuntu-latest
    strategy:
      # Keep every partition's failures and artifacts; do not cancel siblings.
      fail-fast: false
      max-parallel: 4
      matrix:
        partition: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Run isolated Playwright partition (Docker)
        run: make test-e2e E2E_ARGS='--ci-partition=${{ matrix.partition }}/4'

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report-partition-${{ matrix.partition }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  build-prod:
    name: Production image build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build production Docker image
        run: make build-prod

  ci-success:
    name: CI success
    if: always()
    needs: [typecheck, test, test-e2e, build-prod]
    runs-on: ubuntu-latest
    steps:
      - name: Check required jobs
        run: |
          if [[ "${{ needs.typecheck.result == 'success' && needs.test.result == 'success' && needs.test-e2e.result == 'success' && needs.build-prod.result == 'success' }}" != "true" ]]; then
            echo "One or more required jobs did not succeed."
            exit 1
          fi
          echo "All required jobs succeeded."
