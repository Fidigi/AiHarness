<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#16213e" />
  <title>AiHarness — Offline</title>
  <style>
    :root { color-scheme: dark; font: 16px/1.5 system-ui, sans-serif; background: #11182d; color: #eef2fa; }
    body { min-height: 100vh; display: grid; place-items: center; margin: 0; padding: 1rem; }
    main { width: min(32rem, 100%); padding: 2rem; border: 1px solid #40527b; border-radius: 12px; background: #16213e; box-shadow: 0 20px 60px #0008; }
    h1 { color: #e94560; }
    p { color: #b7c1d5; }
    button { padding: .65rem .9rem; border: 0; border-radius: 6px; color: white; background: #e94560; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <h1>AiHarness is offline</h1>
    <p>The local shell is available, but conversations and workspace actions need a connection to the AiHarness server.</p>
    <p id="retry-status" role="status">Checking the connection…</p>
    <button type="button" onclick="location.reload()">Try again</button>
    <script>
      let attempts = 0;
      const maximumAttempts = 3;
      async function checkConnection() {
        attempts += 1;
        try {
          await fetch('/api/auth/status', { cache: 'no-store' });
          location.replace('/');
        } catch {
          const status = document.getElementById('retry-status');
          if (attempts < maximumAttempts) {
            status.textContent = `Still offline — retry ${attempts}/${maximumAttempts}…`;
            setTimeout(checkConnection, 5000);
          } else {
            status.textContent = 'Automatic retries stopped. Try again when your connection is back.';
          }
        }
      }
      setTimeout(checkConnection, 2000);
    </script>
  </main>
</body>
</html>
